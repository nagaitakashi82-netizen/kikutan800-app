<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172d46"><title>キクタン800 | 瞬間英作文</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172d46;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#172d46;color:white;padding:20px 18px}header h1{font-size:21px;margin:0 0 4px}header small{opacity:.8}main{max-width:680px;margin:auto;padding:18px}nav{display:flex;gap:8px;margin-bottom:18px}button,.filelabel{border:0;border-radius:12px;padding:13px 15px;font-size:15px;font-weight:650;cursor:pointer}nav button{flex:1;background:#e3e9f2;color:#172d46}nav button.active,.primary{background:#2355a4;color:white}.secondary{background:#e6ebf2;color:#172d46}.good{background:#d6f4e5;color:#075c37}.bad{background:#ffeadb;color:#8a3a08}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 3px 18px #172d4610;margin-bottom:14px}.muted{color:#69788b;font-size:13px}.jp{font-size:23px;line-height:1.55;font-weight:700;margin:20px 0}textarea,input[type=text]{width:100%;font:inherit;border:1px solid #c9d3df;border-radius:12px;padding:14px;resize:vertical}textarea{min-height:110px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:115px}.answer{background:#eff5ff;border-radius:12px;padding:15px;margin-top:14px;line-height:1.6}.answer strong{display:block;margin-bottom:7px}.hidden{display:none!important}.stat{display:flex;justify-content:space-between;gap:8px}.stat span{font-weight:700}.pill{border-radius:999px;padding:5px 10px;background:#edf2fa;font-size:12px}select{padding:11px;border:1px solid #c9d3df;border-radius:10px;background:white;max-width:100%}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.item{border-bottom:1px solid #e5eaf0;padding:12px 0}.item:last-child{border:0}.item .en{color:#52647c;font-size:14px;margin-top:5px}.item button{padding:7px 10px;font-size:12px;margin-top:7px}.notice{font-size:13px;color:#596c84;line-height:1.6}input[type=file]{display:none}.filelabel{display:inline-block;background:#e6ebf2;color:#172d46}footer{text-align:center;color:#718197;font-size:12px;padding:24px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172d46;color:white;border-radius:12px;padding:12px 18px;display:none;max-width:90vw}
</style></head><body><header><h1>キクタン800 瞬間英作文</h1><small>日本語から英語を、瞬時に。</small></header><main><nav><button id="tabStudy" class="active">学習</button><button id="tabList">問題一覧</button><button id="tabData">データ管理</button></nav><section id="study"><div class="card"><div class="toolbar"><select id="mode"><option value="type">タイピング</option><option value="speak">口頭練習</option></select><select id="scope"><option value="all">全問ランダム</option><option value="review">要復習のみ</option></select></div><div class="stat"><span id="progress" class="muted"></span><span id="word" class="pill hidden"></span></div><div id="jp" class="jp"></div><div id="inputWrap"><textarea id="typed" placeholder="英語で入力してください（電車内でもOK）" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></div><div class="actions"><button class="primary" id="reveal">答えを見る</button></div><div id="result" class="hidden"><div class="answer"><strong id="verdict">模範英文</strong><div id="english"></div><div id="comparison" class="muted" style="margin-top:10px"></div></div><div class="actions"><button class="good" id="correct">正解</button><button class="bad" id="incorrect">要復習</button></div></div><div class="actions"><button class="secondary" id="next">次の問題 →</button></div></div><div class="notice">タイピングは自動判定。言い換えは手動で判定を変更できます。学習データはこのブラウザに保存されます。全問終了後に次の周回を開始できます。</div></section><section id="list" class="hidden"><div class="card"><div class="stat"><h2 style="margin:0;font-size:18px">登録済みの問題</h2><span id="count"></span></div><div id="items"></div></div></section><section id="data" class="hidden"><div class="card"><h2 style="margin-top:0;font-size:19px">問題を追加</h2><p class="notice">ChatGPTで教材写真から作ったJSONファイルを読み込みます。既存の問題は残り、重複はスキップします。</p><label class="filelabel" for="importFile">JSONファイルを読み込む</label><input type="file" id="importFile" accept=".json,application/json"><h3>またはJSONを貼り付け</h3><textarea id="jsonInput" placeholder='[{"japanese":"日本語","english":"English sentence.","target_word":"word","chapter":"Chapter 2"}]'></textarea><div class="actions"><button class="primary" id="importPaste">貼り付けた問題を登録</button></div></div><div class="card"><h2 style="margin-top:0;font-size:19px">バックアップ</h2><p class="notice">端末変更やブラウザのデータ削除に備えて、定期的に保存してください。学習履歴も含みます。</p><div class="actions"><button class="secondary" id="export">全データをJSONで保存</button><label class="filelabel" for="restoreFile">バックアップを復元</label><input type="file" id="restoreFile" accept=".json,application/json"></div></div></section></main><footer>個人学習用 · 教材データの第三者配布はしないでください</footer><div id="toast"></div><script>
const initial=[];
const KEY='kikutan800_fresh_20261123_v2';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.questions)){db={questions:initial,attempts:[],review:{}};save()}db.attempts??=[];db.review??={};const existingIds=new Set();let repaired=false;for(const q of db.questions){if(typeof q.id!=='string'||!q.id||existingIds.has(q.id)){q.id=crypto.randomUUID();repaired=true}existingIds.add(q.id)}if(repaired)save();let queue=[],current=null,seen=0,shown=false,cycleTotal=0,cycleFinished=false;const SESSION_KEY=KEY+'_session_v3';let sessionReady=false;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('保存できませんでした。ブラウザの空き容量を確認し、バックアップを取ってください。')}}function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pool(){return db.questions.filter(q=>$('scope').value==='all'||db.review[q.id]?.needs_review)}function saveSession(){if(!sessionReady)return;try{localStorage.setItem(SESSION_KEY,JSON.stringify({queue, currentId:current?.id??null,seen,cycleTotal,cycleFinished,scope:$('scope').value,mode:$('mode').value,typed:$('typed').value,shown}))}catch(e){console.warn('学習位置の保存に失敗',e)}}
function resetQueue(){queue=shuffle(pool().map(q=>q.id));seen=0;cycleTotal=queue.length;cycleFinished=false;current=null;shown=false;$('next').textContent='次の問題 →';saveSession()}
function finishCycle(){current=null;cycleFinished=true;$('jp').textContent='全問完了！ お疲れさまでした。';$('progress').textContent=`${cycleTotal} / ${cycleTotal} 問`;$('word').classList.add('hidden');$('typed').value='';$('inputWrap').classList.add('hidden');$('result').classList.add('hidden');$('reveal').disabled=true;$('reveal').classList.add('hidden');$('next').textContent='もう一度シャッフルして開始';saveSession()}
function emptyState(){current=null;$('jp').textContent=$('scope').value==='review'?'復習する問題はありません。':'問題を登録してください。';$('word').classList.add('hidden');$('progress').textContent='0問';$('typed').value='';$('result').classList.add('hidden');$('reveal').disabled=true;$('reveal').classList.remove('hidden');$('inputWrap').classList.toggle('hidden',$('mode').value==='speak');saveSession()}
function displayCurrent(){if(!current)return; $('jp').textContent=current.japanese;$('word').classList.add('hidden');$('progress').textContent=`${seen} / ${cycleTotal} 問`;$('result').classList.add('hidden');$('reveal').disabled=false;$('reveal').classList.remove('hidden');$('inputWrap').classList.toggle('hidden',$('mode').value==='speak');$('reveal').textContent='答え合わせ';$('next').textContent='次の問題 →'}
function next(){if(cycleFinished)resetQueue();while(queue.length){const id=queue.pop();const q=db.questions.find(q=>q.id===id);if(!q)continue;current=q;seen++;shown=false;$('typed').value='';displayCurrent();saveSession();return}if(cycleTotal>0&&seen>0){finishCycle();return}if(pool().length){resetQueue();if(queue.length){next();return}}emptyState()}
function restoreSession(){let saved;try{saved=JSON.parse(localStorage.getItem(SESSION_KEY))}catch{};sessionReady=true;if(!saved||!Array.isArray(saved.queue)||!['all','review'].includes(saved.scope)){resetQueue();next();return} $('scope').value=saved.scope;$('mode').value=saved.mode==='speak'?'speak':'type';const valid=new Set(db.questions.map(q=>q.id));queue=saved.queue.filter(id=>valid.has(id));current=db.questions.find(q=>q.id===saved.currentId)||null;seen=Number.isInteger(saved.seen)?saved.seen:0;cycleTotal=Number.isInteger(saved.cycleTotal)?saved.cycleTotal:seen+queue.length;cycleFinished=!!saved.cycleFinished;shown=false;if(cycleFinished){finishCycle();return}if(current){displayCurrent();$('typed').value=saved.typed||'';return}if(queue.length){next();return}if(cycleTotal>0&&seen>0){finishCycle();return}resetQueue();next()}
function normalize(s){return s.toLowerCase().replace(/[.,!?;:'“”‘’]/g,'').replace(/\s+/g,' ').trim()}function reveal(){if(!current)return;shown=true;const mode=$('mode').value,ans=$('typed').value.trim();$('english').textContent=current.english;$('word').textContent=current.target_word?'単語：'+current.target_word:'';$('word').classList.toggle('hidden',!current.target_word);const match=mode==='type'&&normalize(ans)===normalize(current.english);$('verdict').textContent=mode==='speak'?'模範英文':match?'✓ 正解！':'✕ 不正解';$('verdict').style.color=mode==='speak'?'#172d46':match?'#075c37':'#a13922';$('comparison').replaceChildren();if(mode==='type'){const line=document.createElement('div');line.textContent='あなたの回答：'+(ans||'（未入力）');$('comparison').append(line);const hint=document.createElement('div');hint.textContent=match?'模範英文と一致しました。':'模範英文と一致しません。違いを確認してください。';hint.style.marginTop='6px';$('comparison').append(hint)}$('result').classList.remove('hidden');$('reveal').disabled=true;saveSession();if(mode==='type'){const s=db.review[current.id]||{correct_count:0,incorrect_count:0,needs_review:false};if(match)s.correct_count++;else s.incorrect_count++;s.needs_review=!match;s.last_seen_at=new Date().toISOString();db.review[current.id]=s;db.attempts.push({question_id:current.id,mode:'type',typed_answer:ans,self_rating:match?'correct':'review',auto_graded:true,attempted_at:s.last_seen_at});save();$('correct').textContent=match?'正解として記録済み':'正解に変更';$('incorrect').textContent=match?'要復習に変更':'要復習として記録済み';$('correct').disabled=match;$('incorrect').disabled=!match}else{$('correct').textContent='正解';$('incorrect').textContent='要復習';$('correct').disabled=false;$('incorrect').disabled=false}}function rate(ok){if(!current||!shown){toast('先に答えを確認してください');return}let s=db.review[current.id]||{correct_count:0,incorrect_count:0,needs_review:false};if($('mode').value==='type'){const attempt=db.attempts[db.attempts.length-1];if(!attempt||attempt.question_id!==current.id)return;const was=attempt.self_rating==='correct';if(was===ok)return;if(was)s.correct_count=Math.max(0,s.correct_count-1);else s.incorrect_count=Math.max(0,s.incorrect_count-1);if(ok)s.correct_count++;else s.incorrect_count++;s.needs_review=!ok;attempt.self_rating=ok?'correct':'review';attempt.manual_override=true;db.review[current.id]=s;save();$('correct').disabled=ok;$('incorrect').disabled=!ok;$('correct').textContent=ok?'正解として記録済み':'正解に変更';$('incorrect').textContent=ok?'要復習に変更':'要復習として記録済み';toast('判定を変更しました');return}if(ok)s.correct_count++;else s.incorrect_count++;s.needs_review=!ok;s.last_seen_at=new Date().toISOString();db.review[current.id]=s;db.attempts.push({question_id:current.id,mode:'speak',typed_answer:'',self_rating:ok?'correct':'review',attempted_at:s.last_seen_at});save();next()}function tab(name){for(const t of ['study','list','data']){$(t).classList.toggle('hidden',t!==name);$('tab'+t[0].toUpperCase()+t.slice(1)).classList.toggle('active',t===name)}if(name==='list')renderList()}function renderList(){$('count').textContent=db.questions.length+'問';$('items').replaceChildren();db.questions.forEach(q=>{const el=document.createElement('div');el.className='item';const jp=document.createElement('strong');jp.textContent=q.japanese;const en=document.createElement('div');en.className='en';en.textContent=q.english;const meta=document.createElement('div');meta.className='muted';meta.textContent=(q.chapter||'')+' · '+(q.target_word||'')+(db.review[q.id]?.needs_review?' · 要復習':'');const btn=document.createElement('button');btn.className='secondary';btn.textContent='編集';btn.onclick=()=>{let j=prompt('日本語を編集',q.japanese);if(j===null)return;let e=prompt('模範英文を編集',q.english);if(e===null)return;if(!j.trim()||!e.trim())return toast('空欄は保存できません');q.japanese=j.trim();q.english=e.trim();save();renderList()};el.append(jp,en,meta,btn);$('items').append(el)})}function importQuestions(raw){let parsed=JSON.parse(raw);let list=Array.isArray(parsed)?parsed:parsed.questions;if(!Array.isArray(list))throw Error('問題の配列がありません');let count=0;for(const x of list){if(typeof x.japanese!=='string'||typeof x.english!=='string'||!x.japanese.trim()||!x.english.trim())throw Error('日本語・英語が不足している問題があります');if(db.questions.some(q=>normalize(q.english)===normalize(x.english)))continue;db.questions.push({id:crypto.randomUUID(),japanese:x.japanese.trim(),english:x.english.trim(),target_word:String(x.target_word||''),chapter:String(x.chapter||''),page:String(x.page||''),added_at:new Date().toISOString()});count++}save();if(!current){resetQueue();next()}toast(count+'問を追加しました（新しい問題は次の周回から反映）');return count}async function readFile(file,handler){if(!file)return;try{handler(await file.text())}catch(e){alert('読み込みに失敗しました: '+e.message)}}function download(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('tabStudy').onclick=()=>tab('study');$('tabList').onclick=()=>tab('list');$('tabData').onclick=()=>tab('data');$('reveal').onclick=reveal;$('next').onclick=next;$('correct').onclick=()=>rate(true);$('incorrect').onclick=()=>rate(false);$('scope').onchange=()=>{resetQueue();next()};$('mode').onchange=()=>{$('inputWrap').classList.toggle('hidden',$('mode').value==='speak');saveSession()};$('typed').oninput=saveSession;$('importPaste').onclick=()=>{try{importQuestions($('jsonInput').value);$('jsonInput').value=''}catch(e){alert('JSONを確認してください: '+e.message)}};$('importFile').onchange=e=>readFile(e.target.files[0],importQuestions);$('export').onclick=()=>download(db,'kikutan800-backup-'+new Date().toISOString().slice(0,10)+'.json');$('restoreFile').onchange=e=>readFile(e.target.files[0],s=>{const x=JSON.parse(s);if(!Array.isArray(x.questions)||!Array.isArray(x.attempts)||typeof x.review!=='object'||!x.review)throw Error('バックアップ形式が不正です');if(!confirm('現在のデータをバックアップで置き換えますか？'))return;db=x;save();resetQueue();next();toast('復元しました')});restoreSession();
</script></body></html>
